version: '3.9'
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    ports:
      - '8080:8080'
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api}
    ports:
      - '3000:80'
    depends_on:
      - backend
    restart: unless-stopped

# NOTE: Neon (cloud Postgres) is used for production and should be configured
# in `./backend/.env` with `DATABASE_URL`. Do NOT store credentials in this file.

name: Build and Deploy Node.js App to Azure

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install
        working-directory: ./backend

      - name: Generate Prisma
        run: npm run generate
        working-directory: ./backend

      - name: Build project
        run: npm run build
        working-directory: ./backend

      - name: Zip build
        run: |
          cd backend
          zip -r backend.zip dist package.json node_modules

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure via CLI
        run: |
          az webapp deploy \
            --resource-group ai-support-rg \
            --name ai-support-rg \
            --src-path backend/backend.zip \
            --type zip
name: Build and Deploy Node.js App to Azure

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repo
      - uses: actions/checkout@v4

      # 2. Set Node.js version
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 3. Install backend dependencies
      - name: Install dependencies
        run: npm install
        working-directory: ./backend

      # 4. Generate Prisma client
      - name: Generate Prisma
        run: npm run generate
        working-directory: ./backend

      # 5. Build TypeScript project
      - name: Build project
        run: npm run build
        working-directory: ./backend

      # 6. Zip the build
      - name: Zip build
        run: |
          cd backend
          zip -r backend.zip dist package.json node_modules

      # 7. Azure Login (NEW STEP)
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 8. Deploy to Azure Web App (UPDATED)
      - name: Deploy to Azure
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'ai-support-rg'
          package: ./backend/backend.zip
name: Build and Deploy Node.js App to Azure

on:
  push:
    branches:
      - main  # Trigger deployment on main branch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout your repo
      - uses: actions/checkout@v4

      # 2. Set Node.js version
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 3. Install backend dependencies
      - name: Install dependencies
        run: npm install
        working-directory: ./backend

      # 4. Generate Prisma client
      - name: Generate Prisma
        run: npm run generate
        working-directory: ./backend

      # 5. Build TypeScript project
      - name: Build project
        run: npm run build
        working-directory: ./backend

      # 6. Zip the build
      - name: Zip build
        run: |
          cd backend
          zip -r backend.zip dist package.json node_modules

      # 7. Upload zip artifact
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: backend/backend.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      # 1. Download the zip artifact
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: app

      # 2. Deploy to Azure Web App
      - name: Deploy to Azure
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'ai-support-rg'  # Your Azure Web App name
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./app/backend.zip  # Point to the downloaded zip
          slot-name: production
